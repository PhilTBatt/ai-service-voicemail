# Deploys to Azure (BUILD_PLAN Step 8). Only when Phil runs it: Actions > Deploy > Run workflow,
# then pick a step:
#   image                     build the one image the service runs and publish it to GitHub's
#                             registry, tagged with the commit (decision 016)
#   infrastructure-what-if    show what infra/main.bicep would create or change; changes nothing
#   infrastructure-apply      create or update it in rg-callmate-prod (not the apps or jobs)
#   database-setup            once, before the first release: build the image, then run the
#                             job that creates the database's three logins
#   release                   build the image, run the migrations with it, then move the API
#                             and the worker to it
# The Azure steps run in the "production" environment, so GitHub waits for Phil's approval
# first, and sign in to Azure with OIDC: no Azure password is stored in GitHub.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      step:
        description: "What to do"
        type: choice
        options:
          - image
          - infrastructure-what-if
          - infrastructure-apply
          - database-setup
          - release
        default: infrastructure-what-if

permissions:
  contents: read

env:
  # Registry names must be lower case.
  IMAGE: ghcr.io/philtbatt/ai-service-voicemail
  RESOURCE_GROUP: rg-callmate-prod

jobs:
  image:
    if: inputs.step == 'image' || inputs.step == 'database-setup' || inputs.step == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # publish to ghcr.io with the workflow's own token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # Clerk's publishable key is public by design (decision 012); it's a repository
          # variable, not a secret. The build fails without it.
          build-args: CLERK_PUBLISHABLE_KEY=${{ vars.CLERK_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  infrastructure:
    if: startsWith(inputs.step, 'infrastructure')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Phil approves each run (required reviewer), and only this environment's federated
    # credential lets the workflow sign in to Azure.
    environment: production
    permissions:
      contents: read
      id-token: write # the OIDC token Azure exchanges for a sign-in
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check the environment's settings
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          KEY_VAULT_ADMIN_OBJECT_ID: ${{ vars.KEY_VAULT_ADMIN_OBJECT_ID }}
        run: |
          missing=""
          [ -n "$POSTGRES_ADMIN_PASSWORD" ] || missing="$missing POSTGRES_ADMIN_PASSWORD (secret)"
          [ -n "$KEY_VAULT_ADMIN_OBJECT_ID" ] || missing="$missing KEY_VAULT_ADMIN_OBJECT_ID (variable)"
          if [ -n "$missing" ]; then
            echo "::error::Add to the production environment:$missing"
            exit 1
          fi

      - name: What would change
        if: inputs.step == 'infrastructure-what-if'
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          KEY_VAULT_ADMIN_OBJECT_ID: ${{ vars.KEY_VAULT_ADMIN_OBJECT_ID }}
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" \
                         keyVaultAdminObjectId="$KEY_VAULT_ADMIN_OBJECT_ID"

      - name: Apply
        if: inputs.step == 'infrastructure-apply'
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          KEY_VAULT_ADMIN_OBJECT_ID: ${{ vars.KEY_VAULT_ADMIN_OBJECT_ID }}
        run: |
          az deployment group create \
            --name "infrastructure-${GITHUB_RUN_NUMBER}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" \
                         keyVaultAdminObjectId="$KEY_VAULT_ADMIN_OBJECT_ID" \
            --query properties.outputs

  # Puts a built image to work: the jobs first, then (for a release) the migrations, then the
  # apps. Waits for the image job, so it never runs an image that wasn't published.
  release:
    if: inputs.step == 'database-setup' || inputs.step == 'release'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_TAG: ${{ github.sha }}
      POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      KEY_VAULT_ADMIN_OBJECT_ID: ${{ vars.KEY_VAULT_ADMIN_OBJECT_ID }}
      # Optional Key Vault settings, as a JSON list: ["retell-webhook-key"]. Empty: none.
      OPTIONAL_SECRET_NAMES: ${{ vars.OPTIONAL_SECRET_NAMES || '[]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Point the jobs at the new image
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az deployment group create \
            --name "jobs-${GITHUB_RUN_NUMBER}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" \
                         keyVaultAdminObjectId="$KEY_VAULT_ADMIN_OBJECT_ID" \
                         image="$IMAGE:$IMAGE_TAG" \
                         optionalSecretNames="$OPTIONAL_SECRET_NAMES" \
                         deployApps=false \
            --output none

      - name: Set up the database's logins
        if: inputs.step == 'database-setup'
        run: bash .github/scripts/run-azure-job.sh callmate-db-setup

      - name: Run the migrations
        if: inputs.step == 'release'
        run: bash .github/scripts/run-azure-job.sh callmate-migrate

      - name: Move the API and the worker to the new image
        if: inputs.step == 'release'
        run: |
          az deployment group create \
            --name "release-${GITHUB_RUN_NUMBER}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" \
                         keyVaultAdminObjectId="$KEY_VAULT_ADMIN_OBJECT_ID" \
                         image="$IMAGE:$IMAGE_TAG" \
                         optionalSecretNames="$OPTIONAL_SECRET_NAMES" \
                         deployApps=true \
            --query properties.outputs.publicBaseUrl.value --output tsv

      # Step 8's smoke check: the new API answers, and reaches the database.
      - name: Check the API is ready
        if: inputs.step == 'release'
        run: |
          url="$(az containerapp show --name callmate-api --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn --output tsv)"
          for attempt in $(seq 1 30); do
            if curl --silent --fail "https://$url/readyz"; then echo; echo "Ready: https://$url"; exit 0; fi
            sleep 10
          done
          echo "::error::https://$url/readyz didn't answer 200 within 5 minutes"
          exit 1
