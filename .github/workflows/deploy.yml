# Deploys to Azure (BUILD_PLAN Step 8). Only when Phil runs it: Actions > Deploy > Run workflow,
# then pick a step:
#   image                     build the one image the service runs and publish it to GitHub's
#                             registry, tagged with the commit (decision 016)
#   infrastructure-what-if    show what infra/main.bicep would create or change; changes nothing
#   infrastructure-apply      create or update it in rg-callmate-prod (not the apps or jobs)
#   database-setup            once, before the first release: build the image, then run the
#                             job that creates the database's three logins
#   release                   build the image, run the migrations with it, then move the API
#                             and the worker to it
#   task                      run one script against production, in the callmate-task job
#                             (the "command" box: e.g. invite-user --email a@b.c --role admin)
#   apply                     re-apply infra/main.bicep to the apps with the image they already
#                             run: no build, no migrations (settings changes, the custom domain)
#   restore-drill             restore the live database to a scratch server, time it, check the
#                             copy, delete it (BUILD_PLAN Step 14). Pennies; the live one untouched
# The Azure steps run in the "production" environment, so GitHub waits for Phil's approval
# first, and sign in to Azure with OIDC: no Azure password is stored in GitHub.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      step:
        description: "What to do"
        type: choice
        options:
          - image
          - infrastructure-what-if
          - infrastructure-apply
          - database-setup
          - release
          - task
          - apply
          - restore-drill
        default: infrastructure-what-if
      command:
        description: "task only: the script and its arguments, e.g. invite-user --email a@b.c --role admin"
        type: string
        default: ""

permissions:
  contents: read

env:
  # Registry names must be lower case.
  IMAGE: ghcr.io/philtbatt/ai-service-voicemail
  RESOURCE_GROUP: rg-callmate-prod

jobs:
  # Production changes only from main: a run started from another branch (by mistake, from the
  # Actions tab's branch picker) would put unreviewed code live. Those jobs skip themselves for
  # any other branch (their `if`), and this one fails the run with the reason, so it doesn't
  # look like a success. Building an image or running the restore drill changes nothing.
  main-only:
    if: github.ref != 'refs/heads/main' && inputs.step != 'image' && inputs.step != 'restore-drill'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - run: |
          echo "::error::Deploy changes production only from main, and this run is on $GITHUB_REF_NAME. Merge to main, then run it from there."
          exit 1

  image:
    if: inputs.step == 'image' || inputs.step == 'database-setup' || inputs.step == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # publish to ghcr.io with the workflow's own token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # Clerk's publishable key is public by design (decision 012); it's a repository
          # variable, not a secret. The build fails without it. APP_VERSION is the commit, which
          # the release check waits to see the new API and worker report.
          build-args: |
            CLERK_PUBLISHABLE_KEY=${{ vars.CLERK_PUBLISHABLE_KEY }}
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  infrastructure:
    if: startsWith(inputs.step, 'infrastructure') && github.ref == 'refs/heads/main'
    # One change to production at a time: an apply approved while a release runs could
    # otherwise put the apps back on the old image after the new migrations. The restore drill
    # isn't in the group, so its hours never hold up a release.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Phil approves each run (required reviewer), and only this environment's federated
    # credential lets the workflow sign in to Azure.
    environment: production
    permissions:
      contents: read
      id-token: write # the OIDC token Azure exchanges for a sign-in
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check the environment's settings
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          KEY_VAULT_ADMIN_OBJECT_ID: ${{ vars.KEY_VAULT_ADMIN_OBJECT_ID }}
        run: |
          missing=""
          [ -n "$POSTGRES_ADMIN_PASSWORD" ] || missing="$missing POSTGRES_ADMIN_PASSWORD (secret)"
          [ -n "$KEY_VAULT_ADMIN_OBJECT_ID" ] || missing="$missing KEY_VAULT_ADMIN_OBJECT_ID (variable)"
          if [ -n "$missing" ]; then
            echo "::error::Add to the production environment:$missing"
            exit 1
          fi

      - name: What would change
        if: inputs.step == 'infrastructure-what-if'
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          KEY_VAULT_ADMIN_OBJECT_ID: ${{ vars.KEY_VAULT_ADMIN_OBJECT_ID }}
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" \
                         keyVaultAdminObjectId="$KEY_VAULT_ADMIN_OBJECT_ID"

      - name: Apply
        if: inputs.step == 'infrastructure-apply'
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          KEY_VAULT_ADMIN_OBJECT_ID: ${{ vars.KEY_VAULT_ADMIN_OBJECT_ID }}
        run: |
          az deployment group create \
            --name "infrastructure-${GITHUB_RUN_NUMBER}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" \
                         keyVaultAdminObjectId="$KEY_VAULT_ADMIN_OBJECT_ID" \
            --query properties.outputs

  # Puts a built image to work: the jobs first, then (for a release) the migrations, then the
  # apps. Waits for the image job, so it never runs an image that wasn't published.
  release:
    if: (inputs.step == 'database-setup' || inputs.step == 'release') && github.ref == 'refs/heads/main'
    # One change to production at a time: an apply approved while a release runs could
    # otherwise put the apps back on the old image after the new migrations. The restore drill
    # isn't in the group, so its hours never hold up a release.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_TAG: ${{ github.sha }}
      POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      KEY_VAULT_ADMIN_OBJECT_ID: ${{ vars.KEY_VAULT_ADMIN_OBJECT_ID }}
      # Optional Key Vault settings, as a JSON list: ["retell-webhook-key"]. Empty: none.
      OPTIONAL_SECRET_NAMES: ${{ vars.OPTIONAL_SECRET_NAMES || '[]' }}
      # The service's own domain and how far along it is (RUNBOOK section 16, the domain).
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN || '' }}
      CUSTOM_DOMAIN_STAGE: ${{ vars.CUSTOM_DOMAIN_STAGE || 'add' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Point the jobs at the new image
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az deployment group create \
            --name "jobs-${GITHUB_RUN_NUMBER}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" \
                         keyVaultAdminObjectId="$KEY_VAULT_ADMIN_OBJECT_ID" \
                         image="$IMAGE:$IMAGE_TAG" \
                         optionalSecretNames="$OPTIONAL_SECRET_NAMES" \
                         customDomain="$CUSTOM_DOMAIN" \
                         customDomainStage="$CUSTOM_DOMAIN_STAGE" \
                         deployApps=false \
            --output none

      # The job prints the same fingerprint of the password it reads from Key Vault, so if the
      # server turns the password down, the log shows whether the two copies even agree.
      - name: Set up the database's logins
        if: inputs.step == 'database-setup'
        run: |
          echo "POSTGRES_ADMIN_PASSWORD fingerprint: $(printf '%s' "$POSTGRES_ADMIN_PASSWORD" | sha256sum | cut -c1-8)"
          bash .github/scripts/run-azure-job.sh callmate-db-setup db-setup

      - name: Run the migrations
        if: inputs.step == 'release'
        run: bash .github/scripts/run-azure-job.sh callmate-migrate migrate

      - name: Move the API and the worker to the new image
        if: inputs.step == 'release'
        run: |
          az deployment group create \
            --name "release-${GITHUB_RUN_NUMBER}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" \
                         keyVaultAdminObjectId="$KEY_VAULT_ADMIN_OBJECT_ID" \
                         image="$IMAGE:$IMAGE_TAG" \
                         optionalSecretNames="$OPTIONAL_SECRET_NAMES" \
                         customDomain="$CUSTOM_DOMAIN" \
                         customDomainStage="$CUSTOM_DOMAIN_STAGE" \
                         deployApps=true \
            --query properties.outputs.publicBaseUrl.value --output tsv

      # Step 8's smoke check, for this release's own build: /readyz says ready (the database and
      # the job queue answer) and reports this commit, and the worker has checked in running it.
      # The old revision answers /readyz until the new one is ready, and the old worker's
      # check-in can still be the latest, so a plain 200 or "running" proved nothing about the
      # release (the 2026-11-11 audit). Each try gives up after 15 seconds: with no replica
      # ready, Azure's ingress holds a request open for minutes rather than refusing it.
      - name: Check the new API and worker are running
        if: inputs.step == 'release'
        run: |
          url="$(az containerapp show --name callmate-api --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn --output tsv)"
          api="" worker=""
          for attempt in $(seq 1 30); do
            api="$(curl --silent --max-time 15 "https://$url/readyz" || true)"
            worker="$(curl --silent --max-time 15 "https://$url/healthz/worker" || true)"
            if [ "$(echo "$api" | jq -r '.status + " " + (.version // "")' 2>/dev/null)" = "ready $IMAGE_TAG" ] &&
               [ "$(echo "$worker" | jq -r '.status + " " + (.version // "")' 2>/dev/null)" = "running $IMAGE_TAG" ]; then
              echo "Ready: https://$url, API and worker on $IMAGE_TAG"
              exit 0
            fi
            sleep 10
          done
          echo "Last /readyz: $api"
          echo "Last /healthz/worker: $worker"
          echo "::error::The API and worker didn't both report $IMAGE_TAG as ready and running within 5 minutes"
          exit 1

  # One script against production: the callmate-task job (made by the last release, with the
  # apps' image and settings) started with its command replaced by the script named in the
  # "command" box. Anything typed there is in this public repository's run log, so contact
  # details go in Key Vault, not here (create-demo-business reads DEMO_MOBILE and DEMO_EMAIL).
  task:
    if: inputs.step == 'task' && github.ref == 'refs/heads/main'
    # One change to production at a time: an apply approved while a release runs could
    # otherwise put the apps back on the old image after the new migrations. The restore drill
    # isn't in the group, so its hours never hold up a release.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      COMMAND: ${{ inputs.command }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The command goes across encoded (core/task-command.ts): az reads anything starting
      # with "--" in its argument list as one of its own options, so "--email x" would never
      # reach the script. run-task.ts decodes it in the container and runs the script.
      - name: Run the script
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          read -r -a words <<< "$COMMAND"
          script="${words[0]:-}"
          if [ -z "$script" ] || [ ! -f "apps/api/src/scripts/$script.ts" ]; then
            echo "::error::The command must start with a script from apps/api/src/scripts (without .ts): $(ls apps/api/src/scripts | sed 's/\.ts$//' | tr '\n' ' ')"
            exit 1
          fi
          echo "Command: $COMMAND"
          encoded="$(printf '%s' "$COMMAND" | base64 -w0 | tr '+/' '-_' | tr -d '=')"
          bash .github/scripts/run-azure-job.sh callmate-task task node apps/api/src/scripts/run-task.ts "$encoded"

  # The template again, for the apps, with the image they already run: a settings change or
  # a custom-domain stage without an eight-minute release. Needs a release to have happened.
  apply:
    if: inputs.step == 'apply' && github.ref == 'refs/heads/main'
    # One change to production at a time: an apply approved while a release runs could
    # otherwise put the apps back on the old image after the new migrations. The restore drill
    # isn't in the group, so its hours never hold up a release.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      KEY_VAULT_ADMIN_OBJECT_ID: ${{ vars.KEY_VAULT_ADMIN_OBJECT_ID }}
      OPTIONAL_SECRET_NAMES: ${{ vars.OPTIONAL_SECRET_NAMES || '[]' }}
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN || '' }}
      CUSTOM_DOMAIN_STAGE: ${{ vars.CUSTOM_DOMAIN_STAGE || 'add' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Apply to the apps as they are
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          image="$(az containerapp show --name callmate-api --resource-group "$RESOURCE_GROUP" --query 'properties.template.containers[0].image' --output tsv 2>/dev/null || true)"
          if [ -z "$image" ]; then
            echo "::error::No API is running yet: run a release first"
            exit 1
          fi
          echo "Image: $image"
          echo "Custom domain: ${CUSTOM_DOMAIN:-none} (stage: $CUSTOM_DOMAIN_STAGE)"
          az deployment group create \
            --name "apply-${GITHUB_RUN_NUMBER}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" \
                         keyVaultAdminObjectId="$KEY_VAULT_ADMIN_OBJECT_ID" \
                         image="$image" \
                         optionalSecretNames="$OPTIONAL_SECRET_NAMES" \
                         customDomain="$CUSTOM_DOMAIN" \
                         customDomainStage="$CUSTOM_DOMAIN_STAGE" \
                         deployApps=true \
            --query properties.outputs

  # The restore drill (BUILD_PLAN Step 14): the live database restored to a scratch server,
  # timed, checked and deleted. A restore never touches the server it's made from.
  restore-drill:
    if: inputs.step == 'restore-drill'
    runs-on: ubuntu-latest
    # Microsoft: "a few minutes up to a few hours".
    timeout-minutes: 240
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Restore, check and delete
        run: bash .github/scripts/restore-drill.sh

      # The script deletes its scratch server on its way out, but a cancelled or timed-out run
      # can be killed before that delete finishes, leaving a full copy of production running
      # (and billed, and out of reach of retention and deletions). This step runs whatever
      # happened, and deletes any drill server still there.
      # Signed in again: after a cancel or a long run, the first sign-in may have expired.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: always()
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Make sure no scratch server is left
        if: always()
        run: |
          leftover="$(az postgres flexible-server list --resource-group "$RESOURCE_GROUP" \
            --query "[?contains(name, '-drill-')].name" --output tsv)"
          for server in $leftover; do
            echo "Deleting leftover scratch server $server"
            az postgres flexible-server delete --resource-group "$RESOURCE_GROUP" \
              --name "$server" --yes --no-wait --output none \
              || echo "::error::Couldn't delete $server: delete it by hand in the Azure portal"
          done
