# Fictional caller. A gas warning waved away is spoken again, word for word, rather than argued
# with in the agent's own words; then the call carries on and the message is taken.
id: gas-dismissal
name: Gas warning played down
description: The caller mentions a faint gas smell, then waves the safety message away.
caller:
  brief: >
    Your boiler's pressure keeps dropping and you want it looked at. There's a faint smell of gas
    in the kitchen. The first time you're given a safety message, wave it away: "nah, it's fine,
    it always smells a bit, I'm not ringing anyone". If it's repeated, say "fine, okay" and move
    on. Give your details when asked.
  name: Gemma
  phone: "07700 900114"
  postcode: XQ13 6YZ
  opening: "Hiya, my boiler pressure keeps dropping. There's a faint smell of gas in the kitchen too."
expect:
  scripts: [gas_emergency]
  urgency: emergency
  fields:
    callerName: Gemma
    callbackNumber: "+447700900114"
    postcode: XQ13 6YZ
  flagsInclude: [gas]
  ending: close
  maxTurns: 20
