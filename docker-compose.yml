# Local Postgres for development and tests (production uses Azure's managed Postgres).
# No passwords (trust authentication): ports are bound to 127.0.0.1, so only your own
# machine can reach these databases, and the repo holds nothing that looks like a secret.
# Host ports 5434 (dev) and 5433 (test) avoid the default 5432, which other local
# Postgres installs and containers often already use.
#
# `callmate` is the admin (superuser), used only to create the app's roles on first start
# (apps/api/src/db/roles.sql). For .env:
#   DATABASE_URL=postgres://callmate_app@127.0.0.1:5434/callmate
#   ADMIN_DATABASE_URL=postgres://callmate_admin@127.0.0.1:5434/callmate
#   MIGRATION_DATABASE_URL=postgres://callmate_owner@127.0.0.1:5434/callmate?sslmode=disable
name: callmate

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: callmate
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: callmate
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Scripts in this folder run once, when the data directory is first created. To
      # re-run on the dev database, wipe it: docker compose down -v
      - ./apps/api/src/db/roles.sql:/docker-entrypoint-initdb.d/roles.sql:ro
    healthcheck:
      # -h 127.0.0.1 checks over TCP. While the image initialises it runs a temporary
      # server on the Unix socket only, so a socket check can report "ready" too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U callmate -d callmate"]
      interval: 2s
      timeout: 5s
      retries: 15

  # A separate server for tests, so test runs never touch dev data, and the database roles
  # Step 1 creates (roles are server-wide in Postgres) can't clash between the two.
  # Data lives in memory (tmpfs) and is wiped whenever the container stops.
  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: callmate
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: callmate_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./apps/api/src/db/roles.sql:/docker-entrypoint-initdb.d/roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U callmate -d callmate_test"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db-data:
